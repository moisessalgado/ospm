<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vagas de Plantio — Webmap</title>
  <meta name="description" content="Mapa das vagas de plantio de árvores em vias públicas, calculadas a partir de dados do IBGE, OpenStreetMap e Overture Maps." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='20' font-size='22'%3E%F0%9F%8C%B3%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="css/base.css?v=2" />
  <link rel="stylesheet" href="css/style.css?v=6" />
</head>
<body>
  <nav class="site-nav map-nav">
    <a class="brand" href="index.html">
      <svg class="leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 14c0-6 4.5-10 11-10 1 5-1 11-7 11-2.3 0-3.6-.4-4-1Z" />
        <path d="M4 14c3 0 6-1.5 7-5" />
      </svg>
      Vagas de Plantio
    </a>
    <div class="links">
      <a href="index.html" class="active">Mapa</a>
      <a href="metodologia.html">Metodologia</a>
    </div>
  </nav>

  <div id="map"></div>
  <div id="cursor-label" hidden></div>

  <button class="panel-toggle" id="panel-toggle" type="button" aria-expanded="true">Controles</button>

  <div id="panel">
    <h1>Vagas de plantio</h1>
    <p class="subtitle">Pontos para o plantio de árvores em vias públicas</p>

    <div class="field">
      <label for="municipality-select">Município</label>
      <div class="select-wrap"><select id="municipality-select"></select></div>
    </div>

    <div class="field">
      <label for="method-select">Método de alocação</label>
      <div class="select-wrap"><select id="method-select"></select></div>
    </div>

    <div class="field">
      <label for="spacing-select">Espaçamento</label>
      <div class="select-wrap"><select id="spacing-select"></select></div>
    </div>

    <div class="field">
      <label for="basemap-select">Mapa base</label>
      <div class="select-wrap">
        <select id="basemap-select">
          <option value="osm" selected>OpenStreetMap</option>
          <option value="roadmap">Google — Ruas</option>
          <option value="satellite">Google — Satélite</option>
          <option value="hybrid">Google — Híbrido</option>
        </select>
      </div>
    </div>

    <hr class="divider" />

    <label>Medir distância</label>
    <div id="measure-controls">
      <button id="measure-toggle" type="button">Medir</button>
      <button id="measure-clear" type="button">Limpar</button>
    </div>
    <label class="checkbox">
      <input type="checkbox" id="snap-toggle" checked />
      Snap nos pontos de vaga
      <span class="legend-hint" title="Funciona com os pontos individuais — aproxime o zoom (nível 15+).">ⓘ</span>
    </label>
    <div id="measure-status"></div>

    <div id="legend">
      <label class="legend-title">
        <input type="checkbox" id="layer-slots-toggle" checked />
        <strong>Vagas de plantio</strong>
        <span class="legend-hint" title="Cor por porte da árvore, estimado pela classificação da via no OSM. Mais em metodologia.html#variantes.">ⓘ</span>
      </label>
      <div><span class="dot" style="background:#66bb6a"></span> Pequeno</div>
      <div><span class="dot" style="background:#1565c0"></span> Médio</div>
      <div><span class="dot" style="background:#6a1b9a"></span> Grande</div>

      <label class="legend-title">
        <input type="checkbox" id="layer-rejected-toggle" checked />
        <strong>Vagas inviáveis</strong>
        <span class="legend-hint" title="Mesma cor de porte, com o contorno indicando o motivo. Só aparecem a partir do zoom 15.">ⓘ</span>
      </label>
      <div><span class="dot" style="background:#1565c0;outline:2.5px solid #d64545;outline-offset:1px"></span> Sem espaço até a fachada</div>
      <div><span class="dot" style="background:#1565c0;outline:2.5px solid #fdd835;outline-offset:1px"></span> Esquina</div>
      <div><span class="dot" style="background:#1565c0;outline:2.5px solid #e91e63;outline-offset:1px"></span> Via transversal</div>
      <div><span class="dot" style="background:#1565c0;outline:2.5px solid #fb8c00;outline-offset:1px"></span> Travessia</div>
      <div><span class="dot" style="background:#1565c0;outline:2.5px solid #8d6e63;outline-offset:1px"></span> Acesso de garagem</div>
      <div><span class="dot" style="background:#1565c0;outline:2.5px solid #29b6f6;outline-offset:1px"></span> Ponto de ônibus</div>
      <div><span class="dot" style="background:#1565c0;outline:2.5px solid #2e7d32;outline-offset:1px"></span> Árvore existente</div>
    </div>

    <div id="status"></div>

    <div class="panel-note">
      <a href="metodologia.html">Como as vagas são calculadas →</a>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="js/app.js?v=11"></script>
</body>
</html>
